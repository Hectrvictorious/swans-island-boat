name: Swan's Island Boat

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'   # every half hour, off the busy :00/:30 marks (GitHub delays those the most): refresh conditions.json and archive the shared (encrypted) messages
  workflow_dispatch:

permissions:
  contents: write   # to commit site/data/sync.json, the archive of sealed messages from the relay
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refresh conditions.json
        run: python3 tools/fetch_conditions.py site/conditions.json || echo "feeds unavailable, keeping the committed file"
      - name: Archive shared trips (sealed; this step never sees the family key)
        env:
          SYNC_TOPIC: sibferry-fpu8hwfns6miyy6d3c0z
          SYNC_FP: fb4061f5
        run: |
          out=$(python3 tools/merge_sync.py site/data/sync.json || true)
          echo "$out"
          if echo "$out" | grep -q '^changed'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/sync.json
            git commit -q -m "Archive shared trip messages"
            for i in 1 2 3; do
              git push -q origin HEAD:main && break
              git fetch -q origin main && git rebase --autostash -q origin/main || { git rebase --abort 2>/dev/null; break; }
              sleep 3
            done
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
